<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスク管理アプリ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
    <h1>タスク管理アプリ</h1>

<div class="input-area">
    <input type="text" 
    id="taskInput"
    placeholder="タスクを入力">

    <button id="addButton">追加</button>

    <input type="text"
    id="searchInput"
    placeholder="タスクを検索">

    <button id="searchButton">検索</button>

    <button id="resetButton">すべて表示</button>
</div>
    <ul id="taskList"></ul>

</div>

    <script src="script.js"></script>

</body>
</html>
